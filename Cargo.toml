[package]
name = "polybot"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
build = "build.rs"

[features]
default = []
aws = [
    "dep:aws-config",
    "dep:aws-sdk-bedrockruntime",
    "dep:aws-sdk-dynamodb",
    "dep:aws-sdk-s3",
    "dep:aws-sdk-secretsmanager",
    "dep:aws-sdk-sqs",
    "dep:aws_lambda_events",
    "dep:lambda_runtime",
]
browser = ["dep:chromiumoxide"]
# Postgres history archive: durable scan inputs, outcome grading for every
# market seen, and the `backtest` binary. Optional so a laptop can run the
# file store alone.
postgres = ["dep:sqlx"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rust_decimal = { version = "1.37", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

aws-config = { version = "1", optional = true, features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = { version = "1", optional = true }
aws-sdk-dynamodb = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-sdk-secretsmanager = { version = "1", optional = true }
aws-sdk-sqs = { version = "1", optional = true }
aws_lambda_events = { version = "0.18", optional = true, default-features = false, features = ["sqs"] }
lambda_runtime = { version = "0.14", optional = true }
chromiumoxide = { version = "0.8", optional = true, features = ["tokio-runtime"] }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "chrono", "json", "rust_decimal", "uuid"] }

# systemd readiness and watchdog notifications; a no-op without NOTIFY_SOCKET.
[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.5"

[dev-dependencies]
httpmock = "0.8"
pretty_assertions = "1"

[[bin]]
name = "scanner"
path = "src/bin/scanner.rs"

[[bin]]
name = "tui"
path = "src/bin/tui.rs"

[[bin]]
name = "news-worker"
path = "src/bin/news_worker.rs"
required-features = ["aws"]

[[bin]]
name = "source-probe"
path = "src/bin/source_probe.rs"

[[bin]]
name = "paper"
path = "src/bin/paper.rs"

[[bin]]
name = "local"
path = "src/bin/local.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"
required-features = ["postgres"]

[[bin]]
name = "history"
path = "src/bin/history.rs"
required-features = ["postgres"]

[profile.release]
lto = "thin"
strip = "symbols"
